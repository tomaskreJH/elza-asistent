<style>
:root{--bg:#fff;--p:#f3f4f5;--l:rgba(41,49,51,.16);--f:#293133;--m:#5f6b6e;--a:#d9261c;--r:#b00020;--b:#102c54;--w:#b35c00}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--f);font:14px/1.5 Montserrat,"Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}

.brand{padding:0 10px 10px;color:#fff;display:flex;flex-direction:column;gap:2px}.wm{font-weight:700;letter-spacing:.16em;font-size:24px}.wm i{display:inline-block;width:.55em;height:.11em;background:#ff2a17;margin-left:.12em}.brand small{font-size:12px;color:#c9d6e8;letter-spacing:.04em}

main{flex:1;padding:24px 28px;min-width:0}h1{margin:0 0 16px;font-size:22px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}.card h3{margin:0;font-size:15px}.card b{font-size:26px}.card span,.card p{color:var(--m);margin:0}

.note{color:var(--m)}.r{color:var(--r)}.a{color:var(--w)}a{color:var(--a)}

/* menu: skupiny jako rozbalovací sekce */
aside h6{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px;padding:9px 10px;border-radius:9px;font-size:12px;color:#aebfd6;user-select:none}

.nav{min-height:36px}.nav.on{background:#fff;color:var(--b);font-weight:600}
#top,#tabs,#scrim{display:none}

 #tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--m);font:inherit;font-size:11px;padding:6px 2px;min-height:52px;border-radius:12px;cursor:pointer}

 #tabs button.on{color:var(--a);font-weight:600}#tabs button.on svg{stroke-width:2.2}

 main table.mk{display:block;width:100%}main table.mk thead{display:none}main table.mk tbody,main table.mk tr{display:block}main table.mk tr{border:1px solid var(--l);border-radius:12px;padding:8px 12px;margin:0 0 10px}main table.mk td{display:block;border:0;padding:5px 0;text-align:left;word-break:break-word}main table.mk td::before{content:attr(data-l);display:block;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:1px}main table.mk td:empty{display:none}main table.mk td:first-child{display:block;text-align:left;font-weight:600}main table.mk td:first-child::before{display:none}
}
