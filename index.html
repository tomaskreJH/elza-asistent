<!doctype html><html lang=cs><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ELZA Asistent</title>
<style>
:root{--bg:#0b1726;--p:#183050;--l:rgba(246,244,239,.12);--f:#f6f4ef;--m:#9aa6b4;--a:#f2b705;--r:#ff7b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--f);font:14px/1.5 system-ui,"Segoe UI",sans-serif;display:flex;min-height:100vh}
aside{width:230px;flex:none;padding:16px 10px;border-right:1px solid var(--l);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
aside h6{margin:12px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b7785}
.brand{padding:0 10px 8px;font-weight:700;letter-spacing:.06em;font-size:17px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:var(--m);padding:7px 10px;border-radius:9px;font:inherit;cursor:pointer}
.nav:hover,.nav.on{background:var(--p);color:var(--f)}.nav.off{opacity:.5}
main{flex:1;padding:24px 28px;min-width:0}h1{margin:0 0 16px;font-size:22px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input,select{background:var(--p);color:var(--f);border:1px solid var(--l);border-radius:9px;padding:8px 10px;font:inherit}input{min-width:280px}
button.b{cursor:pointer;background:var(--a);color:#0b1726;border:0;font-weight:600;border-radius:9px;padding:8px 12px;font:inherit;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--l);vertical-align:top}th{color:var(--m);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}.card h3{margin:0;font-size:15px}.card b{font-size:26px}.card span,.card p{color:var(--m);margin:0}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--l);color:var(--m);margin:0 4px 4px 0}
.note{color:var(--m)}.r{color:var(--r)}.a{color:var(--a)}a{color:var(--a)}
.me{margin-top:auto;font-size:12px;color:var(--m);padding:10px}
@media(max-width:800px){body{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap}}
</style>
<aside></aside><main id=main></main>
<script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
<script>
const CID="7822640e-2537-46eb-8db1-830d38fff665",TEN="35c5f53c-ce94-445a-b877-54965e3be6d3",HOME="https://tomaskrejh.github.io/elza-asistent/",SP="https://elzycz.sharepoint.com",SITE="/sites/ELZA-asistent",SC=[SP+"/AllSites.Read"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const POP=window.opener&&/[#?&](code|error|state)=/.test(location.hash+location.search);
let m,acc=null,tok=null,cur="prehled";const cache={};
const MENU=[["Sledování",[["prehled","Přehled"]]],["Obsah",[["pravo","Právo a normy"],["skilly","Skilly"],["agenti","Elzáčci"],["mapa","Mapa vazeb"],["postupy","Postupy",0],["prompty","Prompty",0],["foto","Foto příkazy",0],["brand","Brand",0]]],["Moje",[["posta","Pošta",0],["kalendar","Kalendář",0]]]];
const LBL={};MENU.forEach(g=>g[1].forEach(i=>LBL[i[0]]=i[1]));
async function token(popup){try{tok=(await m.acquireTokenSilent({scopes:SC,account:acc})).accessToken}catch(e){if(!popup)throw e;tok=(await m.acquireTokenPopup({scopes:SC,account:acc})).accessToken}}
async function login(){const mn=$("#main");try{const r=await m.loginPopup({scopes:["User.Read"],extraScopesToConsent:SC});acc=r.account;m.setActiveAccount(acc);await token(true);nav();go(cur)}catch(e){mn.innerHTML='<h1>Přihlášení se nepodařilo</h1><p class=r>'+esc(e.message)+'</p>'}}
async function list(t,sel){const k=t+sel;if(cache[k])return cache[k];await token(false);const u=SP+SITE+"/_api/web/lists/getbytitle('"+encodeURIComponent(t)+"')/items?$top=500&$select="+sel;const r=await fetch(u,{headers:{Authorization:"Bearer "+tok,Accept:"application/json;odata=nometadata"}});if(!r.ok)throw new Error(t+": HTTP "+r.status);return cache[k]=(await r.json()).value}
const dt=(d,w)=>{if(!d)return"";const n=Math.round((new Date(d)-Date.now())/864e5);const c=n<0?"r":(w&&n<w)?"a":"";return '<span class="'+c+'">'+new Date(d).toLocaleDateString("cs-CZ")+(c=="r"?" (po termínu)":c=="a"?" (brzy)":"")+'</span>'};
const tags=a=>a.filter(Boolean).map(x=>'<span class=tag>'+esc(x)+'</span>').join("");
let Q="",PO="",PD=[],SD=[],AD=[],MD=[],MS="";
async function prehled(){const n=await Promise.all(["Předpisy","Skilly","Agenti","Funkce","Workflow a vazby"].map(async t=>[t,(await list(t,"Id")).length]));return '<h1>Přehled</h1><div class=grid>'+n.map(x=>'<div class=card><b>'+x[1]+'</b><span>'+esc(x[0])+'</span></div>').join("")+'</div>'}
async function pravo(){PD=await list("Předpisy","Title,Oznaceni,Oblast,Stav,PlatiDo,DalsiKontrola,Zdroj,Poznamka");const ob=[...new Set(PD.map(x=>x.Oblast).filter(Boolean))].sort();return '<h1>Právo a normy</h1><div class=bar><input id=q placeholder="Hledat podle § , čísla nebo názvu" value="'+esc(Q)+'"><select id=o><option value="">Všechny oblasti</option>'+ob.map(x=>'<option'+(x==PO?" selected":"")+'>'+esc(x)+'</option>').join("")+'</select></div><div id=tb></div>'}
function pravoT(){const q=Q.toLowerCase();const r=PD.filter(x=>(!PO||x.Oblast==PO)&&(!q||[x.Title,x.Oznaceni,x.Poznamka].join(" ").toLowerCase().includes(q)));$("#tb").innerHTML='<p class=note>'+r.length+' předpisů</p><table><tr><th>Označení<th>Název<th>Stav<th>Platí do<th>Další kontrola<th></tr>'+r.map(x=>'<tr><td>'+esc(x.Oznaceni)+'<td>'+esc(x.Title)+'<td>'+esc(x.Stav)+'<td>'+dt(x.PlatiDo,60)+'<td>'+dt(x.DalsiKontrola,0)+'<td>'+(/^https?:/.test(x.Zdroj||"")?'<a target=_blank rel=noopener href="'+esc(x.Zdroj)+'">zdroj</a>':"")+'</tr>').join("")+'</table>'}
function pravoM(){$("#q").oninput=e=>{Q=e.target.value;pravoT()};$("#o").onchange=e=>{PO=e.target.value;pravoT()};pravoT()}
async function skilly(){SD=await list("Skilly","Title,Layer,SkillGroup,Domain,ModelTier,Purpose,Scope");return '<h1>Skilly</h1><div class=bar><input id=q placeholder="Hledat skill" value="'+esc(Q)+'"></div><div id=tb></div>'}
function skillyT(){const q=Q.toLowerCase();const r=SD.filter(x=>!q||[x.Title,x.Purpose,x.Domain,x.SkillGroup].join(" ").toLowerCase().includes(q));$("#tb").innerHTML='<p class=note>'+r.length+' skillů</p><div class=grid>'+r.map(x=>'<div class=card><h3>'+esc(x.Title)+'</h3>'+tags([x.Layer,x.Domain,x.SkillGroup,x.ModelTier,x.Scope])+'<p>'+esc(x.Purpose)+'</p></div>').join("")+'</div>'}
function skillyM(){$("#q").oninput=e=>{Q=e.target.value;skillyT()};skillyT()}
async function agenti(){AD=await list("Agenti","Title,AgentType,Role,Status,AutonomyLevel,Skills");return '<h1>Elzáčci</h1><div class=grid>'+AD.map(x=>'<div class=card><h3>'+esc(x.Title)+'</h3>'+tags([x.AgentType,x.Status,x.AutonomyLevel])+'<p>'+esc(x.Role)+'</p><p>'+esc(x.Skills)+'</p></div>').join("")+'</div>'}
async function mapa(){MD=await list("Workflow a vazby","FromId,ToId,RelationType,Condition");return '<h1>Mapa vazeb</h1><div class=bar id=mn></div><div id=tb></div>'}
function mapaT(){const ids=[...new Set(MD.flatMap(x=>[x.FromId,x.ToId]).filter(Boolean))].sort();$("#mn").innerHTML=ids.map(i=>'<button class="nav'+(i==MS?" on":"")+'" style="width:auto" data-i="'+esc(i)+'">'+esc(i)+'</button>').join("");$("#mn").onclick=e=>{const i=e.target.dataset&&e.target.dataset.i;if(i){MS=i==MS?"":i;mapaT()}};const r=MS?MD.filter(x=>x.FromId==MS||x.ToId==MS):MD;$("#tb").innerHTML='<p class=note>'+r.length+' vazeb'+(MS?" pro "+esc(MS):"")+'</p><table><tr><th>Od<th>Vztah<th>Do<th>Podmínka</tr>'+r.map(x=>'<tr><td>'+esc(x.FromId)+'<td>'+esc(x.RelationType)+' →<td>'+esc(x.ToId)+'<td>'+esc(x.Condition)+'</tr>').join("")+'</table>'}
const VIEWS={prehled:[prehled],pravo:[pravo,pravoM],skilly:[skilly,skillyM],agenti:[agenti],mapa:[mapa,mapaT]};
function nav(){$("aside").innerHTML='<div class=brand>ELZA Asistent</div>'+MENU.map(g=>'<h6>'+g[0]+'</h6>'+g[1].map(i=>'<button class="nav'+(i[0]==cur?" on":"")+(i[2]===0?" off":"")+'" data-v="'+i[0]+'">'+i[1]+'</button>').join("")).join("")+'<div class=me>'+(acc?esc(acc.name||acc.username)+'<br><button class=nav data-v=_out>Odhlásit</button>':'<button class=b data-v=_in>Přihlásit firemním účtem</button>')+'</div>'}
async function go(id){cur=id;Q="";nav();const v=VIEWS[id],mn=$("#main");if(!v){mn.innerHTML='<h1>'+esc(LBL[id]||id)+'</h1><p class=note>Tento modul se právě připravuje. Plán přenosu z konzole AI_TOM je v dokumentu KONZOLE-PRENOS.md na SharePointu.</p>';return}if(!tok){mn.innerHTML='<h1>ELZA Asistent</h1><p class=note>Přihlaste se firemním účtem. Data se čtou ze SharePointu podle vašich práv, v aplikaci se nic neukládá.</p>';return}mn.innerHTML='<p class=note>Načítám…</p>';try{mn.innerHTML=await v[0]();if(v[1])v[1]()}catch(e){mn.innerHTML='<p class=r>Chyba: '+esc(e.message)+'</p>'}}
document.addEventListener("click",e=>{const v=e.target.dataset&&e.target.dataset.v;if(!v)return;if(v=="_in")login();else if(v=="_out"){m.logoutPopup({account:acc}).then(()=>{acc=null;tok=null;go("prehled")})}else go(v)});
async function main(){m=new msal.PublicClientApplication({auth:{clientId:CID,authority:"https://login.microsoftonline.com/"+TEN,redirectUri:HOME},cache:{cacheLocation:"sessionStorage"}});try{if(m.initialize)await m.initialize()}catch(e){}acc=m.getAllAccounts()[0]||null;if(acc){try{await token(false)}catch(e){}}go(cur)}
if(POP)document.body.textContent="Dokončuji přihlášení…";else main();
</script>
