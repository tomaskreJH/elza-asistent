<script>
const CID="7822640e-2537-46eb-8db1-830d38fff665",TEN="35c5f53c-ce94-445a-b877-54965e3be6d3",HOME="https://tomaskrejh.github.io/elza-asistent/",SP="https://elzycz.sharepoint.com",SITE="/sites/ELZA-asistent",SC=[SP+"/AllSites.Read"];

let m,acc=null,tok=null,cur="dnes";const cache={};const PERSRE=/jachti|jachta|plachetn|katamaran|plavb|kapitán|sardini|hokej|hockey|střely|sailing/i,PERSL=["Prompty","Postupy","Foto příkazy","Brand"];const PERS=(t,v)=>PERSL.includes(t)?v.filter(x=>!PERSRE.test(JSON.stringify(x))):v;

async function token(popup){try{tok=(await m.acquireTokenSilent({scopes:SC,account:acc})).accessToken}catch(e){if(!popup)throw e;try{tok=(await m.acquireTokenPopup({scopes:SC,account:acc})).accessToken}catch(e2){if(POPERR(e2)){await m.acquireTokenRedirect({scopes:SC,account:acc});return}throw e2}}}

async function list(t,sel){const k=t+sel;if(cache[k])return cache[k];await token(false);const u=SP+SITE+"/_api/web/lists/getbytitle('"+encodeURIComponent(t)+"')/items?$top=500&$select="+sel;const r=await fetch(u,{headers:{Authorization:"Bearer "+tok,Accept:"application/json;odata=nometadata"}});if(!r.ok)throw new Error(t+": HTTP "+r.status);return cache[k]=PERS(t,(await r.json()).value)}
async function list(t,sel){const k=t+sel;if(cache[k])return cache[k];await token(false);const b=SP+SITE+"/_api/web/"+(t=="Foto příkazy"?"GetList('"+SITE+"/Lists/FotoPrikazy')":"lists/getbytitle('"+encodeURIComponent(t)+"')");const r=await fetch(b+"/items?$top=500&$select="+sel,{headers:{Authorization:"Bearer "+tok,Accept:"application/json;odata=nometadata"}});if(!r.ok)throw new Error(t+": HTTP "+r.status);return cache[k]=PERS(t,(await r.json()).value)}
const dt=(d,w)=>{if(!d)return"";const n=Math.round((new Date(d)-Date.now())/864e5);const c=n<0?"r":(w&&n<w)?"a":"";return '<span class="'+c+'">'+new Date(d).toLocaleDateString("cs-CZ")+(c=="r"?" (po termínu)":c=="a"?" (brzy)":"")+'</span>'};

function mapaT(){const ids=[...new Set(MD.flatMap(x=>[x.FromId,x.ToId]).filter(Boolean))].sort();$("#mn").innerHTML=ids.map(i=>'<button class="nav'+(i==MS?" on":"")+'" style="width:auto" data-i="'+esc(i)+'">'+esc(i)+'</button>').join("");$("#mn").onclick=e=>{const i=e.target.dataset&&e.target.dataset.i;if(i){MS=i==MS?"":i;mapaT()}};const r=MS?MD.filter(x=>x.FromId==MS||x.ToId==MS):MD;$("#tb").innerHTML='<p class=note>'+r.length+' vazeb'+(MS?" pro "+esc(MS):"")+'</p><table><tr><th>Od<th>Vztah<th>Do<th>Podmínka</tr>'+r.map(x=>'<tr><td>'+esc(x.FromId)+'<td>'+esc(x.RelationType)+' →<td>'+esc(x.ToId)+'<td>'+esc(x.Condition)+'</tr>').join("")+'</table>'}

function tema(){document.body.classList.toggle("dark");try{localStorage.setItem("elzaTema",document.body.classList.contains("dark")?"d":"l")}catch(e){}}

document.addEventListener("click",e=>{const gr=e.target.dataset&&e.target.dataset.gr;if(gr){OPEN[gr]=OPEN[gr]===false;try{localStorage.setItem("elzaMenu",JSON.stringify(OPEN))}catch(x){}nav();return}const v=e.target.dataset&&e.target.dataset.v;if(!v)return;if(v=="_kanal")window.prepniKanal();else if(v=="_theme")tema();else if(v=="_in")login();else if(v=="_out"){m.logoutPopup({account:acc}).then(()=>{acc=null;tok=null;go("prehled")})}else go(v)});
async function main(){if(/[?&]demo=1/.test(location.search)){acc={name:"Ukázkový uživatel",username:"tkrejci@elzy.cz"};tok="demo";cur=/[?&]v=(\w+)/.test(location.search)?RegExp.$1:"posta";nav();go(cur);return}m=new msal.PublicClientApplication({auth:{clientId:CID,authority:"https://login.microsoftonline.com/"+TEN,redirectUri:HOME},cache:{cacheLocation:"sessionStorage"}});try{if(m.initialize)await m.initialize()}catch(e){}try{const rr=await m.handleRedirectPromise();if(rr&&rr.account){m.setActiveAccount(rr.account)}}catch(e){}acc=m.getAllAccounts()[0]||null;if(acc){try{await token(false)}catch(e){}}go(cur);if(tok)setTimeout(function(){window.aiCheck&&window.aiCheck()},1200)}
